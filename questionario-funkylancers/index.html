  @media(max-width:900px){.fl-shell{grid-template-columns:minmax(0,1fr);max-width:700px}.fl-scene{position:relative;top:auto;min-height:0;aspect-ratio:4/5;border-radius:22px}.fl-scene.is-mini{position:fixed;inset:0;aspect-ratio:auto;border-radius:0;box-shadow:none;z-index:0}.fl-scene.is-mini .fl-scene-bg{object-position:center top;animation:none}.fl-scene.is-mini .fl-scene-copy{display:none}.fl-scene.is-mini::before{height:12%}.fl-scene.is-mini+.fl-main{margin-top:min(30vh,240px)}.fl-main{border-radius:22px}.fl-content{min-height:560px}}
  @media(max-width:560px){.fl-shell{padding:12px;gap:12px}.fl-scene{aspect-ratio:4/5;min-height:0;border-radius:18px}.fl-brand{top:13px;left:15px;font-size:13px}.fl-scene-copy{left:12px;right:12px}.fl-progress-wrap{padding:15px 18px 12px}.fl-content{padding:23px 19px;min-height:0}.fl-content h1{font-size:31px}.fl-content h2{font-size:27px}.fl-duo{grid-template-columns:1fr}.fl-costs{grid-template-columns:1fr}.fl-offer{grid-template-columns:1fr 78px;gap:10px}.fl-pick-grid{grid-template-columns:1fr;grid-auto-rows:auto}.fl-picks--3{grid-template-columns:repeat(2,minmax(0,1fr))}.fl-cost-input{max-width:none}.fl-nav .fl-button{min-width:0;flex:1;padding:12px 16px}.fl-footer{padding:13px 18px}}

<body class="fl-body">
<main class="fl-shell">
  <aside class="fl-scene" id="scene" aria-label="Tempio di Delfi in costruzione con piccoli robot assistenti">
    <img class="fl-scene-bg" src="/assets/funkylancers-delfi-sfondo.jpg" width="1122" height="1402" alt="Robot costruttori al lavoro intorno al tempio di Delfi">
    <div class="fl-flyer" aria-hidden="true"><div class="fl-flyer-flip"><div class="fl-flyer-bob"><img src="/assets/funkylancers-robot-volante.webp" width="268" height="400" alt=""><span class="fl-rotor"></span></div></div></div>
    <a class="fl-brand" href="/" target="_blank" rel="noopener">GEORGE MATEI</a>
    <div class="fl-scene-copy">
      <div class="fl-greek" lang="grc">γνῶθι σεαυτόν <span aria-hidden="true">·</span> conosci te stesso</div>
      <p>Prima facciamo chiarezza su ciò che conta. Poi immaginiamo cosa può costruire l’AI per aiutarti a farlo.</p>
    </div>
  </aside>

  <section class="fl-main">
    <div class="fl-progress-wrap" id="progressWrap" hidden>
      <div class="fl-progress-top"><span>Ricerca Funkylancers</span><span id="stepCount"></span></div>
      <div class="fl-progress" role="progressbar" aria-label="Avanzamento del questionario" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progressFill"></i></div>
    </div>
    <div class="fl-content" id="content"></div>
    <div class="fl-footer"><span>Nessuna risposta viene pubblicata singolarmente</span><a href="/privacy/" target="_blank" rel="noopener noreferrer">Privacy e dati</a></div>
  </section>
</main>
<script>
(() => {
  "use strict";
  const API = "https://george-questionari.vercel.app/q/funkylancers-ricerca-ai";
  const KEY = "gm-questionario-funkylancers-v4";
  const content = document.getElementById("content");
  const progressWrap = document.getElementById("progressWrap");
  const progressFill = document.getElementById("progressFill");
  const stepCount = document.getElementById("stepCount");
  const progressBar = document.querySelector(".fl-progress");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } };
  let answers = read();
  let current = -1;
  let sending = false;
  let started = false;
  const scene = document.getElementById('scene');
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch {} };
  const field = (id,label,opts={}) => `<div class="fl-field"><label for="${id}">${label}${opts.required?'<span class="fl-required" aria-label="obbligatorio">*</span>':''}</label>${opts.textarea?`<textarea class="fl-textarea" id="${id}" data-field="${id}" ${opts.rows?`rows="${opts.rows}"`:''} ${opts.required?'required':''} maxlength="1600" placeholder="${opts.placeholder||'Scrivi con parole tue…'}">${esc(answers[id]||'')}</textarea>`:`<input class="fl-input" id="${id}" data-field="${id}" type="${opts.type||'text'}" ${opts.required?'required':''} ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.step?`step="${opts.step}"`:''} ${opts.max?`max="${opts.max}"`:''} ${opts.autocomplete?`autocomplete="${opts.autocomplete}"`:''} ${opts.inputmode?`inputmode="${opts.inputmode}"`:''} maxlength="${opts.maxlength||500}" value="${esc(answers[id]||'')}" placeholder="${opts.placeholder||''}">`}</div>`;
  const MAX = {pain:5,desiderio:3};
  const extra = {pain:0,desiderio:0};
  const shown = key => { let last=0; for(let n=1;n<=MAX[key];n++) if((answers[`${key}${n}`]||'').trim()) last=n; return Math.max(2,last,extra[key]); };
  const boxes = (key,label,first,addLabel) => { const count=shown(key); let html=''; for(let n=1;n<=count;n++){ const box=field(`${key}${n}`,`${label} ${n}`,{textarea:true,rows:n===1?3:2,required:n===1,placeholder:n===1?first:'Facoltativo'}); html+=n===2?`<div class="fl-ghost">${box}</div>`:box; } return html+(count<MAX[key]?`<button type="button" class="fl-ideas-toggle fl-add" data-add="${key}">${addLabel}</button>`:''); };
  const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const baseSteps = [
    {id:'who',kicker:'Prima di iniziare',title:'Chi sei?',render:()=>`<div class="fl-duo">${field('nome','Nome',{required:true,maxlength:80,autocomplete:'given-name'})}${field('cognome','Cognome',{required:true,maxlength:80,autocomplete:'family-name'})}</div>${field('email','Email (facoltativa): ti mando il tuo PDF personale',{type:'email',maxlength:160,autocomplete:'email',inputmode:'email'})}<fieldset class="fl-figure" id="figura"><legend class="fl-label">Il personaggio nel tuo PDF</legend><label><input type="radio" name="figura" value="femminile" data-figura ${answers.figura==='femminile'?'checked':''}> Femminile</label><label><input type="radio" name="figura" value="maschile" data-figura ${answers.figura==='maschile'?'checked':''}> Maschile</label></fieldset><div class="fl-duo">${field('data_nascita','Data di nascita (facoltativa)',{type:'date',min:'1900-01-01',max:today(),autocomplete:'bday'})}${field('ora_nascita','Ora di nascita (facoltativa)',{type:'time'})}</div><label class="fl-consent"><input type="checkbox" id="consenso_profilo" data-consent ${answers.consenso_profilo?'checked':''}><span>Se indico data o ora di nascita, acconsento a che George Dragos Matei le usi per leggere il mio profilo (tema natale, Gene Keys o simili) e che le posizioni calcolate, senza il mio nome, passino a un assistente AI per preparare il mio PDF.</span></label>`},
    {id:'problems',kicker:'Il tuo business, oggi',title:'Quali problemi ti pesano di più nel tuo business?',render:()=>`<p class="fl-help">Quelli che ti costano più tempo, soldi o energie, partendo dal più importante. Bastano poche parole.</p>${boxes('pain','Problema','Il problema che pesa di più','+ Aggiungi un altro problema')}`},
    {id:'desires',kicker:'I tuoi desideri',title:'Se il genio AI della lampada ti concedesse 3 desideri per il tuo business, cosa chiederesti?',render:()=>`<p class="fl-help">Per un attimo, tutto è possibile. Parti da quello che vuoi di più.</p>${boxes('desiderio','Desiderio','Il desiderio che vuoi di più','+ Aggiungi il terzo desiderio')}`},
    {id:'missing',kicker:'L’ultimo pezzo',title:'Che cosa senti che ti manca per arrivare alla versione ideale di te e del tuo business?',render:()=>`<p class="fl-help">Può essere una competenza, una persona, un sistema, del tempo o qualcos’altro.</p>${field('manca','Che cosa ti manca',{textarea:true,rows:3,required:true,placeholder:'Scrivi con parole tue…'})}${field('nota_finale','Vuoi aggiungere qualcosa?',{textarea:true,rows:2,placeholder:'Facoltativo. Per favore non inserire nomi di clienti o informazioni riservate.'})}`}
  ];
  const getSteps = () => baseSteps;
  const setAnswer = (id,value) => { answers[id]=value; save(); };
  const next = () => { const steps=getSteps(); if(current<steps.length-1){current++; render();} else submit(); };
  const back = () => { if(current>=0){current--;render();} };
  const trumpetPath = new Path2D('M-30-2.6H6C12-2.6 19-7 26-11.5C28-12.6 30-11.8 30-9.5V9.5C30 11.8 28 12.6 26 11.5C19 7 12 2.6 6 2.6H-30ZM-35-4.5H-30V4.5H-35ZM-16-2.6V-9H-13V-2.6ZM-8-2.6V-9H-5V-2.6ZM0-2.6V-9H3V-2.6ZM-18-10.5H-11V-8.5H-18ZM-10-10.5H-3V-8.5H-10ZM-2-10.5H5V-8.5H-2ZM-18 2.6C-18 10-4 10 -4 2.6H-7C-7 6.5-15 6.5-15 2.6Z');
  const trumpetShine = new Path2D('M-28-1.5H5C9-1.5 14-3.5 19-6.5L20-5C14-1.4 10-.4 5-.4H-28Z');
  const leafPath = new Path2D('M-16 0C-9-8 7-9 17 0C7 9-9 8-16 0Z');
  const leafRib = new Path2D('M-16 0H15');
  function drawPiece(g,p){
    g.save();g.translate(p.x,p.y);g.rotate(p.r);g.scale(p.s,p.s*(p.leaf?Math.cos(p.t*p.flip)*.75+.35:1));g.globalAlpha=Math.min(1,p.life*2.4);
    if(p.leaf){g.fillStyle=p.tone;g.fill(leafPath);g.strokeStyle='#dfe6b8';g.lineWidth=1.1;g.stroke(leafRib);}
    else{const m=g.createLinearGradient(0,-12,0,12);m.addColorStop(0,'#fbe7a6');m.addColorStop(.48,'#d9aa45');m.addColorStop(1,'#94691d');g.fillStyle=m;g.fill(trumpetPath);g.fillStyle='rgba(255,250,222,.8)';g.fill(trumpetShine);}
    g.restore();
  }
  function celebrate(origin){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    document.querySelector('.fl-burst')?.remove();
    const c=document.createElement('canvas');c.className='fl-burst';c.setAttribute('aria-hidden','true');
    const dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;document.body.appendChild(c);
    const g=c.getContext('2d');g.scale(dpr,dpr);
    const box=origin.getBoundingClientRect(),ox=Math.min(W-30,Math.max(30,box.left+box.width/2)),oy=Math.min(H-40,Math.max(80,box.top));
    const tones=['#6f8038','#8a9a48','#55682c','#a3ad5f'];
    const pieces=Array.from({length:34},(_,i)=>{const leaf=i>=10,a=-Math.PI/2+(Math.random()-.5)*1.9,v=(leaf?430:520)+Math.random()*(leaf?520:380);
      return{leaf,x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*6.3,vr:(Math.random()-.5)*(leaf?9:6),s:leaf?.7+Math.random()*.55:.62+Math.random()*.34,tone:tones[i%4],flip:5+Math.random()*7,t:0,life:1};});
    let last=performance.now();const dur=1.5;setTimeout(()=>c.remove(),2600);
    (function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;g.clearRect(0,0,W,H);let alive=false;
      for(const p of pieces){p.t+=dt;p.life=1-p.t/dur;if(p.life<=0)continue;alive=true;const drag=p.leaf?2.3:1.2;p.vx-=p.vx*drag*dt;p.vy+=((p.leaf?620:980)-p.vy*drag)*dt;p.x+=p.vx*dt+(p.leaf?Math.sin(p.t*7+p.flip)*.7:0);p.y+=p.vy*dt;p.r+=p.vr*dt;drawPiece(g,p);}
      if(alive)requestAnimationFrame(frame);else c.remove();})(last);
  }
  function addListeners(){
    content.querySelectorAll('[data-field]').forEach(el=>{el.addEventListener('input',()=>setAnswer(el.dataset.field,el.value));el.addEventListener('change',()=>setAnswer(el.dataset.field,el.value));});
    content.querySelectorAll('[data-add]').forEach(btn=>btn.addEventListener('click',()=>{const key=btn.dataset.add;extra[key]=shown(key)+1;render();document.getElementById(`${key}${extra[key]}`)?.focus();}));
    const consent=content.querySelector('[data-consent]');if(consent)consent.addEventListener('change',()=>setAnswer('consenso_profilo',consent.checked?'sì':''));
    content.querySelectorAll('[data-figura]').forEach(r=>r.addEventListener('change',()=>setAnswer('figura',r.value)));
    const n=document.getElementById('next'); if(n)n.addEventListener('click',()=>{
      const required=content.querySelectorAll('[data-field][required]');
      const fail=(el,text)=>{el.focus();el.setAttribute('aria-invalid','true');let msg=content.querySelector('.fl-required-error');if(!msg){msg=document.createElement('p');msg.className='fl-error fl-required-error';msg.setAttribute('role','alert');content.querySelector('.fl-nav').before(msg);}msg.textContent=text;};
      for(const el of required){if(!el.value.trim()||!el.checkValidity()){fail(el,'Controlla i campi obbligatori per continuare.');return;}}
      const em=document.getElementById('email');if(em&&em.value.trim()&&!/^[^\s@<>,;"'()]{1,64}@[^\s@<>,;"'()]{1,180}\.[a-z]{2,}$/i.test(em.value.trim())){fail(em,'Controlla l’indirizzo email.');return;}if(em&&em.value.trim()&&!answers.figura){fail(content.querySelector('[data-figura]'),'Scegli il personaggio per il tuo PDF.');return;}const birth=['data_nascita','ora_nascita'].map(id=>document.getElementById(id));if(birth[0]&&!birth[0].checkValidity()){fail(birth[0],'Controlla la data di nascita.');return;}if(consent&&!consent.checked&&birth.some(el=>el&&el.value)){fail(consent,'Se indichi i dati di nascita serve il consenso, oppure lasciali vuoti.');return;}
      if(current<steps.length-1)celebrate(n);
      next();
    });
    const b=document.getElementById('back');if(b)b.addEventListener('click',back);
  }
  function render(){
    steps=getSteps();progressWrap.hidden=current<0;scene.classList.toggle('is-mini',current>=0);
    if(current<0){
      content.innerHTML=`<p class="fl-kicker">Una ricerca tra Funkylancers</p><h1>Tre domande sul tuo business.</h1><p class="fl-lede">Cosa ti pesa, cosa chiederesti al genio AI della lampada e cosa senti che ti manca. Bastano un paio di minuti.</p><div class="fl-note"><strong>Non è anonimo: saprò chi ha scritto cosa.</strong> All’inizio ti chiedo nome e cognome e, se vuoi, email e dati di nascita: in cambio ti mando un PDF personale con la tua ombra e la tua luce. Partecipare è facoltativo. Evita nomi di clienti e dati riservati.<details><summary>I dettagli, senza giri di parole</summary>Se mi lasci i dati di nascita e il consenso, li uso per leggere il tuo profilo personale (tema natale, Gene Keys o simili): puoi ritirare il consenso quando vuoi. Il database delle risposte non salva l’indirizzo IP, ma salva data e ora dell’invio. I servizi che ospitano sito e API possono trattare dati tecnici, come gli IP, nei propri log di sicurezza. Se lasci l’email, le risposte e le posizioni del tuo tema passano in automatico a un assistente AI (Claude di Anthropic) per scrivere il PDF: non gli passo nome, cognome ed email, ma quello che scrivi nei campi liberi arriva così com’è, quindi non inserire nomi di clienti o dati riservati. Le risposte non vengono pubblicate singolarmente. <a href="/privacy/" target="_blank" rel="noopener noreferrer">Leggi l’informativa</a>.</details></div><p class="fl-help">Le risposte restano in questo dispositivo fino all’invio.</p><button class="fl-button fl-start" id="start">Inizia</button>`;
      document.getElementById('start').addEventListener('click',()=>{current=0;started=true;render();});return;
    }
    if(current>=steps.length){current=steps.length-1;}
    const s=steps[current];const pct=Math.round(((current+1)/steps.length)*100);progressFill.style.width=pct+'%';progressBar.setAttribute('aria-valuenow',String(pct));stepCount.textContent=`${current+1} di ${steps.length}`;
    content.innerHTML=`<p class="fl-kicker">${s.kicker}</p><h2>${s.title}</h2>${s.render()}<label class="fl-honeypot" aria-hidden="true">Lascia vuoto<input type="text" id="sito" name="sito" tabindex="-1" autocomplete="off"></label><div class="fl-nav"><button type="button" class="fl-button fl-button--quiet" id="back">Indietro</button><button type="button" class="fl-button" id="next">${current===steps.length-1?'Invia le risposte':'Continua'}</button></div>`;
    document.getElementById('back').style.visibility=current===0?'hidden':'visible';
    addListeners();
    if(started){if(innerWidth<=900)scrollTo({top:0,behavior:'auto'});else{const top=document.querySelector('.fl-main').getBoundingClientRect().top+scrollY-24;if(scrollY>top)scrollTo({top,behavior:'auto'});}const t=content.querySelector('h2');if(t){t.setAttribute('tabindex','-1');t.focus({preventScroll:true});}}
    started=true;
  }
  function cleanAnswers(){
    const out={};
    Object.keys(answers).forEach(k=>{if(typeof answers[k]==='string'&&answers[k].trim())out[k]=answers[k];});
    return out;
  }
  let invio='';
  async function submit(){
    if(sending)return;sending=true;const btn=document.getElementById('next');if(btn){btn.disabled=true;btn.textContent='Invio…';}
    invio=invio||(crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join(''));
    const payload={risposte:cleanAnswers(),sito:document.getElementById('sito')?.value||'',invio};
    try{
      const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:AbortSignal.timeout(25000)});
      let j={};try{j=await r.json();}catch{}
      if(!r.ok)throw new Error(j.errore||'il server non ha accettato l’invio');
      const answersEmail=!!(answers.email||'').trim();try{localStorage.removeItem(KEY);}catch{}
      if(btn)celebrate(btn);
      progressWrap.hidden=true;
      content.innerHTML=`<div class="fl-thanks"><div class="fl-stamp" aria-hidden="true">✦</div><p class="fl-kicker">Grazie</p><h2>Il tuo feedback è arrivato.</h2>${answersEmail?'<p class="fl-lede">Se l’indirizzo è corretto, il tuo PDF arriverà via email, di solito in pochi minuti.</p>':''}<p class="fl-lede">Tra 3 secondi ti porto sul sito di <a href="/">George Matei</a>.</p></div>`;
      setTimeout(()=>{location.href='/';},3000);
    }catch(e){
      const err=document.createElement('p');err.className='fl-error';err.setAttribute('role','alert');err.textContent=`Non sono riuscito a inviare le risposte${e instanceof TypeError||e.name==='TimeoutError'?'':` (${e.message})`}. Sono ancora salvate su questo dispositivo: riprova tra poco.`;content.querySelector('.fl-error[role=alert]')?.remove();content.querySelector('.fl-nav')?.before(err);if(btn){btn.disabled=false;btn.textContent='Riprova invio';}sending=false;
    }
  }
  let steps=getSteps();
  document.addEventListener('input',e=>{if(e.target?.dataset?.field)setAnswer(e.target.dataset.field,e.target.value);});
  render();
})();
</script>
